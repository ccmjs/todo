<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f3">
    <title>Momentum · Deine Aufgaben. Deine Erfolge.</title>
    <style>body { margin: 0; background: #f6f7f3; } .startup-error { padding: 2rem; font-family: system-ui, sans-serif; }</style>
    <script src="./libs/framework/ccm-28.0.0.min.js"></script>
    <script type="module">
      import { demo } from './resources/configs.mjs';
      let instance;
      try {
        instance = await ccm.instance('./ccm.todo.mjs', demo, document.querySelector('#app'));
        await instance.start();
      }
      catch (error) {
        // A failed component start renders its own retry UI. Dependency failures need a fallback.
        if (!instance) {
          const message = document.createElement('p');
          message.className = 'startup-error';
          message.textContent = `Momentum konnte nicht gestartet werden: ${error.message}`;
          document.body.append(message);
        }
      }
    </script>
  </head>
  <body><div id="app"></div></body>
</html>
